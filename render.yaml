services:
  - type: web
    name: nexadesk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_MESSAGE_CONTENT_INTENT
        value: true
      - key: DISCORD_GUILD_MEMBERS_INTENT
        value: true
      - key: DASHBOARD_PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: DOCS_TOTP_SECRET
        sync: false
      - key: DOCS_TOTP_ISSUER
        value: NexaDesk
      - key: DOCS_TOTP_ACCOUNT
        sync: false
      - key: RUN_BOT
        value: true
      - key: BOT_HA_ENABLED
        value: true
      - key: BOT_INSTANCE_ID
        value: render-dashboard-standby
      - key: BOT_LEASE_TTL_MS
        value: 12000
      - key: BOT_LEASE_RENEW_MS
        value: 4000
      - key: BOT_FAILOVER_POLL_MS
        value: 2500
      - key: BOT_LEASE_CLAIM_SETTLE_MS
        value: 500
      - key: KEEPALIVE_ENABLED
        value: true
      - key: KEEPALIVE_URL
        value: https://nexa-desk.onrender.com/health
      - key: KEEPALIVE_INTERVAL_MS
        value: 300000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live
      - key: PREMIUM_PACK_PRICE_CENTS
        value: 300
      - key: PREMIUM_PACK_SLOTS
        value: 3
      - key: PREMIUM_PACK_CURRENCY
        value: eur
      - key: GROQ_API_KEY
        sync: false
      - key: AI_PROVIDER_TIMEOUT_MS
        value: 3200
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_VISION_MODEL
        value: qwen/qwen3.6-27b
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_TTS_MODEL
        value: s2.1-pro-free
      - key: FISH_AUDIO_TTS_REFERENCE_ID
        value: 21adf3cda02a4aa88dc593353cc9d715
      - key: FISH_AUDIO_TTS_FORMAT
        value: opus
      - key: FISH_AUDIO_TTS_LATENCY
        value: low
      - key: FISH_AUDIO_TTS_STREAM_FORMAT
        value: mp3
      - key: FISH_AUDIO_TTS_STREAM_LATENCY
        value: low
      - key: FISH_AUDIO_TTS_STREAM_CHUNK_LENGTH
        value: 80
      - key: FISH_AUDIO_TTS_STREAM_MIN_CHUNK_LENGTH
        value: 25
      - key: FISH_AUDIO_TTS_STREAM_MP3_BITRATE
        value: 64
      - key: FISH_AUDIO_TTS_OPUS_BITRATE
        value: 32000
      - key: FISH_AUDIO_TTS_SPEED
        value: 1.08
      - key: FISH_AUDIO_TTS_VOLUME
        value: 0
      - key: FISH_AUDIO_TTS_CHUNK_LENGTH
        value: 220
      - key: FISH_AUDIO_TTS_MAX_CHARS
        value: 260
      - key: FISH_AUDIO_TIMEOUT_MS
        value: 5000
      - key: VOICE_TTS_PROVIDER
        value: fish
      - key: VOICE_TTS_STREAMING_ENABLED
        value: true
      - key: VOICE_TTS_PREWARM_ENABLED
        value: true
      - key: VOICE_TTS_MAX_CHARS
        value: 220
      - key: AI_PROVIDER
        value: groq
      - key: AI_ACTIONS_ENABLED
        value: true
      - key: AI_ACTIONS_AUTONOMOUS_BANS
        value: true
      - key: AI_ACTIONS_BAN_CONFIDENCE
        value: 96
      - key: AI_ACTIONS_CHANNEL_CONFIDENCE
        value: 90
      - key: AI_ACTIONS_LOCK_CONFIDENCE
        value: 92
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2:3b
