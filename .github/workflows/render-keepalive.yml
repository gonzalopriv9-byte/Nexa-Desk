name: Render Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake NexaDesk Render standby
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --max-time 25 \
            --retry 2 --retry-delay 5 \
            https://nexa-desk.onrender.com/health/ha
